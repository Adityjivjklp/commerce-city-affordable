<!DOCTYPE html>
<html lang="en" data-theme-default="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0757CF" />
    <meta name="description" content="Explore Life, Fire, Marine and Health Insurance through Commerce City, the Class XI Business Studies exhibition project at Asset Public School." />
    <title>Commerce City | Types of Insurance – Asset Public School</title>
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <script>
      (function () {
        var d = document.documentElement, stored = null;
        try { stored = localStorage.getItem('app-theme'); } catch (e) {}
        var mode = stored || d.getAttribute('data-theme-default') || 'light';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.classList.toggle('dark', dark);
      })();
    </script>
    <script defer src="%VITE_APPER_SDK_CDN_URL%"></script>
    <style>
      #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f8fbff; color: #60748f; font: 14px/1.4 system-ui, sans-serif; }
      #app-loading .ring { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #d9e9fc; border-top-color: #0757CF; animation: app-spin .8s linear infinite; }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="app-loading"><div class="ring"></div><span id="app-loading-name"></span></div></div>
    <script>document.getElementById('app-loading-name').textContent = document.title;</script>
    <script>
      (function () {
        function note(text) {
          var el = document.getElementById('app-loading');
          if (!el) return;
          var p = el.querySelector('.note');
          if (!p) {
            p = document.createElement('span');
            p.className = 'note';
            p.style.cssText = 'font-size:12px;opacity:.7;max-width:22rem;text-align:center';
            el.appendChild(p);
          }
          p.textContent = text;
        }
        setTimeout(function () { note('Starting up… the first open can take a few seconds.'); }, 3000);
        setTimeout(function () { note('Still loading. If this continues, check your connection and refresh.'); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
